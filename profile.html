<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thông tin cá nhân</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- TODO: Xem / cập nhật thông tin cá nhân. Chưa đăng nhập (currentUser) -> chuyển về login.html -->
  <div class="wrapper">
    <!-- Header đồng bộ -->
    <div class="header">
      <h1>Cửa hàng điện thoại di động</h1>
      <div id="HienThiND" class="user-display-header">
        <span>Chào <strong id="HienThiTen"></strong>!</span>
        <button id="DangXuat" type="button">Đăng xuất</button>
      </div>
    </div>

    <!-- Main Layout có Sidebar bên trái -->
    <div class="main">
      <div class="Left_Menu">
        <a href="index.html">🏠 Trang chủ</a>
        <a href="products.html">📱 Danh sách sản phẩm</a>
        <a href="cart.html">🛒 Giỏ hàng</a>
        <a href="order-history.html">📦 Lịch sử đơn hàng</a>
        <a href="profile.html" class="active">👤 Thông tin cá nhân</a>
      </div>

      <div class="Content">
        <h2>Thông tin cá nhân</h2>
        <div class="profile-card">
          <form id="profile-form">
            <div class="form-infomation">
              <label class="form-label" for="profile-name">Họ và tên</label>
              <input type="text" class="form-control" id="profile-name" required>
            </div>
            <div class="form-infomation">
              <label class="form-label" for="profile-email">Email</label>
              <input type="email" class="form-control profile-email-input" id="profile-email" required>
            </div>
            <div class="form-infomation">
              <label class="form-label" for="profile-phone">Số điện thoại</label>
              <input type="tel" class="form-control" id="profile-phone" required>
            </div>
            <div class="form-infomation">
              <label class="form-label" for="profile-address">Địa chỉ giao hàng mặc định</label>
              <textarea class="form-control profile-textarea" id="profile-address" rows="3" required></textarea>
            </div>
            <div class="form-infomation">
              <label class="form-label" for="profile-password">Mật khẩu mới (để trống nếu không muốn đổi)</label>
              <input type="password" class="form-control" id="profile-password" placeholder="Nhập mật khẩu mới nếu muốn đổi">
            </div>
            <button type="submit" class="btn btn-primary profile-btn">Lưu thay đổi</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Footer đồng bộ -->
    <div class="footer">
      <p>&copy; Quản lý Cửa hàng Điện thoại di động</p>
    </div>
  </div>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
