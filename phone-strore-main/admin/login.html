<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Quản trị - Phone Store Admin</title>
    <!-- Nhúng CSS từ thư mục assets -->
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

    <div class="admin-login-card">
        <h2>🔒 Phone Store Admin</h2>
        <p>Hệ thống Quản trị Cửa hàng Điện thoại</p>

        <div id="adminError" class="error-message"></div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label for="adminUsername">Tài khoản Quản trị</label>
                <input type="text" id="adminUsername" required placeholder="Nhập tài khoản admin">
            </div>
            <div class="form-group">
                <label for="adminPassword">Mật khẩu</label>
                <input type="password" id="adminPassword" required placeholder="Nhập mật khẩu">
            </div>
            <button type="submit" class="btn-admin-login">Đăng nhập Bảng điều khiển</button>
        </form>

        <div class="login-footer">
            <a href="../index.html">← Quay lại trang khách hàng</a>
        </div>
    </div>

    <!-- Nhúng JS từ thư mục assets -->
    <script src="../assets/js/admin.js"></script>
</body>
</html>
