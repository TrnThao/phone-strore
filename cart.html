<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giỏ hàng & Thanh toán</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- TODO: Tăng/giảm/xóa sản phẩm; chọn địa chỉ (tài khoản / nhập mới, có validate); thanh toán (mặc định tiền mặt); xác nhận đơn -> order-history.html -->
  <div class="wrapper">
    <!-- Header đồng bộ tuyệt đối với trang chủ -->
    <div class="header">
      <h1>Cửa hàng điện thoại di động</h1>
      <div class="header-dangnhap-dangky">
        <button id="dangnhap" type="button" onclick="location.href='login.html'">Đăng nhập</button>
        <button id="dangky" type="button" onclick="location.href='login.html?mode=register'">Đăng ký</button>
      </div>
      <div id="HienThiND" style="display: none;">
        <span>Chào <strong id="HienThiTen"></strong>!</span>
        <button id="DangXuat" type="button">Đăng xuất</button>
      </div>
    </div>

    <!-- Main Layout có đầy đủ Sidebar bên trái đồng bộ với index.html -->
    <div class="main">
      <div class="Left_Menu">
        <a href="index.html">🏠 Trang chủ</a>
        <a href="products.html">📱 Danh sách sản phẩm</a>
        <a href="cart.html" class="active">🛒 Giỏ hàng</a>
        <a href="order-history.html">📦 Lịch sử đơn hàng</a>
        <a href="profile.html" class="active">👤 Thông tin cá nhân</a>
      </div>

      <div class="Content">
        <h2>Giỏ hàng của bạn</h2>
        
        <div style="display: flex; flex-wrap: wrap; gap: 30px; justify-content: space-between;">
          <!-- Khu vực danh sách sản phẩm trong giỏ -->
          <div class="cart-list" style="flex: 1; min-width: 300px; background: #fff; padding: 20px; border-radius: 8px; border: 1px solid var(--line);">
            <div class="text-muted">Đang tải giỏ hàng...</div>
          </div>

          <!-- Cột thông tin thanh toán -->
          <div class="left_menu" style="flex: 0 0 350px; background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid var(--line); height: fit-content;">
            <h3 style="font-size: 18px; margin-bottom: 15px; color: var(--text);">Thông tin thanh toán</h3>
            <form id="checkout-form">
              <div class="form-infomation">
                <label for="fullname" class="form-label">Họ và tên người nhận</label>
                <input type="text" class="form-control" id="fullname" required>
              </div>
              <div class="form-infomation">
                <label for="phone" class="form-label">Số điện thoại</label>
                <input type="tel" class="form-control" id="phone" required>
              </div>
              <div class="form-infomation">
                <label for="address" class="form-label">Địa chỉ giao hàng</label>
                <textarea class="form-control" id="address" rows="3" required></textarea>
              </div>
              <div class="form-infomation">
                <label class="form-label" for="payment-method">Hình thức thanh toán</label>
                <select id="payment-method" class="form-control" required>
                  <option value="Tiền mặt (COD)">Tiền mặt khi nhận hàng</option>
                  <option value="Chuyển khoản">Chuyển khoản ngân hàng</option>
                </select>
              </div>
              <hr style="border: 0; border-top: 1px solid var(--line); margin: 15px 0;">
              <div class="form-infomation" style="display: flex; justify-content: space-between; align-items: center;">
                <span>Tổng thanh toán:</span>
                <strong class="text-danger" id="cart-total">0 VNĐ</strong>
              </div>
              <button type="submit" class="btn btn-primary w-100" id="btn-checkout">Xác nhận đặt hàng</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer đồng bộ -->
    <div class="footer">
      <p>&copy; Quản lý Cửa hàng Điện thoại di động</p>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
