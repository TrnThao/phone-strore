<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Danh sách sản phẩm & Tìm kiếm</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/shop.css">
</head>

<body id="top">

  <!-- Thanh thông báo trên cùng (giữ nguyên dòng chữ chạy qua lại) -->
  <div class="topbar">
    <h1>CHÀO MỪNG ĐẾN VỚI CỬA HÀNG ĐIỆN THOẠI</h1>
  </div>

  <!-- Header
       Hàng 1: logo | Danh mục | ô tìm kiếm + nút Tìm kiếm | Giỏ hàng | Đăng nhập / người dùng
       Hàng 2: khoảng giá + Xóa bộ lọc -->
  <div class="header">
    <div class="header-inner">

      <a class="brand" href="index.html">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="6" y="2" width="12" height="20" rx="2.5"/>
          <path d="M11 18.5h2"/>
        </svg>
        <span>Cửa hàng<br>điện thoại</span>
      </a>

      <!-- Danh mục: rê chuột hoặc bấm vào để mở menu -->
      <div class="danh-muc" tabindex="0" role="button" aria-haspopup="true">
        <div class="danh-muc-nut">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
          </svg>
          <span>Danh mục</span>
          <svg class="mui-ten" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </div>
        <nav class="danh-muc-menu" aria-label="Danh mục">
          <div class="menu-hop">
            <div class="menu-muc">
              <a data-link="products" href="?view=products">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18.5h2"/>
              </svg>
              <span>Danh sách sản phẩm</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m9 6 6 6-6 6"/>
              </svg>
            </a>
              <!-- Menu con: các hãng, do product.js tạo từ dữ liệu categories -->
              <div class="menu-con">
                <div class="menu-hop" id="menuHang"></div>
              </div>
            </div>
          </div>
        </nav>
      </div>

      <form action name="tksp" class="khunglocsp">
        <label class="locsp timkiem">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <span class="sr-only">Tên sản phẩm</span>
          <input id="fQ" name="tktsp" type="text" placeholder="Bạn muốn mua gì hôm nay? VD: iPhone 15">
        </label>

        <button type="button" onclick="loc()">Tìm kiếm</button>

        <a class="gio-hang" data-link="cart" href="?view=cart">
          <svg class="gio-hang-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              aria-hidden="true">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>
          </svg>
          <span>Giỏ hàng</span>
          <span class="gio-hang-badge" id="cart-count" hidden>0</span>
        </a>

        <div class="locgia">
          <span class="locgia-nhan">Khoảng giá (₫)</span>
          <div class="locsp" style="margin:0">
            <input class="input" id="price-min" min="0" placeholder="Giá từ (₫)" type="number"/>
            <input class="input" id="price-max" min="0" placeholder="Giá đến (₫)" type="number"/>
          </div>
        </div>

        <button class="" type="submit">Xóa bộ lọc</button>
      </form>

      <!-- Chưa đăng nhập: nút Đăng nhập -->
      <button id="dangnhap" type="button" onclick="location.href='login.html'">
        <span>Đăng nhập</span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
        </svg>
      </button>

      <!-- Đã đăng nhập: biểu tượng người dùng + menu Hồ sơ / Lịch sử / Đăng xuất -->
      <div id="HienThiND" style="display: none;" tabindex="0">
        <div class="nd-nut">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
          </svg>
          <span class="nd-chao">Chào mừng <strong id="HienThiTen"></strong>!</span>
          <svg class="mui-ten" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </div>
        <div class="nd-menu">
          <div class="menu-hop">
            <a data-link="profile" href="?view=profile">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10.5" r="2.2"/>
                <path d="M5.5 16.5a3.5 3.5 0 0 1 7 0"/><path d="M15 9.5h3.5M15 13h3.5"/>
              </svg>
              <span>Hồ sơ cá nhân</span>
            </a>
            <a data-link="orders" href="?view=orders">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9.5 8h5M9.5 12h5"/>
              </svg>
              <span>Lịch sử mua hàng</span>
            </a>
            <button id="DangXuat" type="button">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
              </svg>
              <span>Đăng xuất</span>
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Nội dung chính -->
  <div class="page">
    <main class="main-col">
      <div class="section-title">ĐIỆN THOẠI</div>

      <div id="categoryFilter" class="cate-container"></div>

      <div class="danhmuc">
        <div class="content" id="productContainer"></div>
        <nav id="pagination" class="pagination" aria-label="Phân trang sản phẩm"></nav>
      </div>
    </main>
  </div>

  <a class="len-dau" href="#top" aria-label="Lên đầu trang">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m6 15 6-6 6 6"/><path d="m6 21 6-6 6 6" opacity=".55"/>
    </svg>
    <span>Lên đầu</span>
  </a>

  <div class="footer">
    <p>&copy; Quản lý Cửa hàng Điện thoại di động</p>
  </div>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/product.js"></script>
  <script src="assets/js/shop.js"></script>
  <script src="assets/js/cart-icon.js"></script>
</body>

</html>
