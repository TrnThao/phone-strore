<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width,initial-scale=1" name="viewport"/>
    <title>Đăng nhập / Đăng ký</title>
    <link href="assets/css/auth.css" rel="stylesheet"/>
</head>
<body>
    <main>
        <a href="index.html">← Trang chủ</a>
        <h1 id="title">Đăng nhập</h1>
        <form id="auth">
            <div hidden="" id="extra">
                <label>Họ và tên
                    <input name="name"/>
                </label>
                <label>Số điện thoại
                    <input inputmode="tel" name="phone" pattern="[0-9]{9,11}"/>
                </label>
            </div>
            <label>Email
                <input name="email" required="" type="email"/>
            </label>
            <label>Mật khẩu
                <input minlength="6" name="password" required="" type="password"/>
            </label>
            <button id="submit">Đăng nhập</button>
        </form>
        <p class="error" id="msg"></p>
        <p id="switch"></p>
        <p><small>Chỉ dành cho mô phỏng front-end. Không sử dụng mật khẩu thật.</small>
        </p>
    </main>
    <script defer="" src="assets/js/login.js"></script>
</body>
</html>
