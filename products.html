<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Danh sách sản phẩm & Tìm kiếm</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <!-- TODO: Danh sách theo loại (có phân trang) + tìm cơ bản (tên) + tìm nâng cao (tên + loại + khoảng giá), kết quả có phân trang -->
  <div>
    <div id="site-header"></div>
    <form action name="tksp" class="khunglocsp">
      <label class="locsp">
        Ten san pham
        <input id="fQ" name="tktsp" type="text" placeholder="VD: Iphone 15">
      </label>
      <label class="locsp">
        Hang
        <select id="categoryFilter"></select>
      </label>

      <div class="">Khoảng giá (₫)
        <div class="locsp" style="margin:0">
          <input class="input" id="price-min" min="0" placeholder="Giá từ (₫)" type="number"/>
          <input class="input" id="price-max" min="0" placeholder="Giá đến (₫)" type="number"/>
        </div>
      </div>
      <button type="button" onclick="loc()">Tim kiem</button>
      <button class="" type="submit">Xoa bo loc</button>
    </div>
    <div class="layout">
      <nav aria-label="Menu khách hàng" class="side">
          <a data-link="products" href="?view=products"> Danh sách sản phẩm</a>
          <a data-link="cart" href="?view=cart"> Giỏ hàng</a>
          <a data-link="orders" href="?view=orders"> Lịch sử mua hàng</a>
          <a data-link="profile" href="?view=profile"> Hồ sơ cá nhân</a>
      </nav>
    </div>
    <div>
      <div class="content" id="productContainer"></div>
    </div>
    </form>



    
  <div class="footer">
    <p>&copy; Quản lý Cửa hàng Điện thoại di động</p>
  </div>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/product.js"></script>
</body>

</html>
