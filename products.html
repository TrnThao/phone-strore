<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Danh sách sản phẩm & Tìm kiếm</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- TODO: Danh sách theo loại (có phân trang) + tìm cơ bản (tên) + tìm nâng cao (tên + loại + khoảng giá), kết quả có phân trang -->
  <div class="wrapper">
    <!-- Header đồng bộ -->
    <div class="header">
      <h1>Cửa hàng điện thoại di động</h1>
      <div class="header-dangnhap-dangky">
        <button id="dangnhap" type="button" onclick="location.href='login.html'">Đăng nhập</button>
        <button id="dangky" type="button" onclick="location.href='login.html?mode=register'">Đăng ký</button>
      </div>
      <div id="HienThiND" style="display: none;">
        <span>Chào <strong id="HienThiTen"></strong>!</span>
        <button id="DangXuat" type="button">Đăng xuất</button>
      </div>
    </div>

    <!-- Main Layout -->
    <div class="main">
      <div class="Left_Menu">
        <a href="index.html">🏠 Trang chủ</a>
        <a href="products.html" class="active">📱 Danh sách sản phẩm</a>
        <a href="cart.html">🛒 Giỏ hàng</a>
        <a href="order-history.html">📦 Lịch sử đơn hàng</a>
        <a href="profile.html" class="active">👤 Thông tin cá nhân</a>
      </div>

      <div class="Content">
        <h2>Danh sách sản phẩm & Tìm kiếm</h2>

        <!-- Khung tìm kiếm nâng cao & cơ bản -->
        <div class="search-filter-box" style="background:#fff; padding:15px; border-radius:8px; border:1px solid var(--line); margin-bottom:20px;">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; align-items: flex-end;">
            
            <!-- Tìm cơ bản theo tên -->
            <div class="field" style="margin-bottom:0;">
              <label style="font-weight:600; font-size:0.85rem; color:var(--muted);">Tìm theo tên</label>
              <input type="text" id="search-name" class="form-control" placeholder="Nhập tên điện thoại...">
            </div>

            <!-- Lọc theo hãng sản xuất -->
            <div class="field" style="margin-bottom:0;">
              <label style="font-weight:600; font-size:0.85rem; color:var(--muted);">Hãng sản xuất</label>
              <select id="filter-cat" class="form-control">
                <option value="">Tất cả hãng</option>
              </select>
            </div>

            <!-- Lọc theo khoảng giá từ -->
            <div class="field" style="margin-bottom:0;">
              <label style="font-weight:600; font-size:0.85rem; color:var(--muted);">Giá từ (₫)</label>
              <input type="number" id="price-from" class="form-control" placeholder="Ví dụ: 5000000" min="0" step="500000">
            </div>

            <!-- Lọc theo khoảng giá đến -->
            <div class="field" style="margin-bottom:0;">
              <label style="font-weight:600; font-size:0.85rem; color:var(--muted);">Đến giá (₫)</label>
              <input type="number" id="price-to" class="form-control" placeholder="Ví dụ: 30000000" min="0" step="500000">
            </div>

          </div>
          <div style="margin-top: 15px; display: flex; gap: 10px;">
            <button id="btn-search" class="btn" style="background:var(--accent); color:#fff; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:600;">🔍 Tìm kiếm nâng cao</button>
            <button id="btn-reset" class="btn" style="background:transparent; border:1px solid var(--line); padding:8px 16px; border-radius:6px; cursor:pointer;">Đặt lại</button>
          </div>
        </div>

        <!-- Vùng hiển thị danh sách sản phẩm (Lưới sản phẩm) -->
        <div id="product-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px;">
          <!-- Sản phẩm sẽ được render tự động bằng JS -->
        </div>

        <!-- Phân trang -->
        <div id="pagination" style="display: flex; justify-content: center; gap: 8px; margin-top: 20px;">
          <!-- Các nút phân trang render bằng JS -->
        </div>

      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <p>&copy; Quản lý Cửa hàng Điện thoại di động</p>
    </div>
  </div>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/product.js"></script>
</body>
</html>
