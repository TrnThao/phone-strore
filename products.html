<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Danh sách sản phẩm & Tìm kiếm</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <!-- TODO: Danh sách theo loại (có phân trang) + tìm cơ bản (tên) + tìm nâng cao (tên + loại + khoảng giá), kết quả có phân trang -->
  <div>
    <div id="site-header"></div>
    <form action name="tksp" class="khunglocsp">
      <label class="locsp">
        Ten san pham
        <input id="fQ" name="tktsp" type="text" placeholder="VD: Iphone 15">
      </label>
      <label class="locsp">
        Hang
        <select id="categoryFilter"></select>
      </label>

      <div class="">Khoảng giá (₫)
        <div class="locsp" style="margin:0">
          <input id="priceFrom" type="number" min="0" step="100000" placeholder="Từ" aria-label="Giá từ">
          <input id="priceTo" type="number" min="0" step="100000" placeholder="Đến" aria-label="Giá đến">
        </div>
      </div>
      <button type="button" onclick="loc()">Tim kiem</button>
      <button class="" type="submit">Xoa bo loc</button>
    </div>
    <div>
      <div class="left_menu">
        <div>Trang chu</div>
      </div>
      <div class="content">
        <div class="sanpham">
          <img src="assets/images/ip15prmm.png"
            class="pic">
          <div class="productList" data-product-id="SP01"></div>
        </div>
        <div class="sanpham">
          <img src="assets/images/ip15.png"
            class="pic">

          <div class="productList" data-product-id="SP02"></div>
        </div>
        <div class="sanpham">
          <img src="assets/images/ip13.png"
            class="pic">

          <div class="productList" data-product-id="SP03"></div>
        </div>
        <div class="sanpham">
          <img src="assets/images/s24ultra.png"
            class="pic">

          <div class="productList" data-product-id="SP04"></div>
        </div>
        <div class="sanpham">
          <img src="assets/images/zfold5.jpg"
            class="pic">

          <div class="productList" data-product-id="SP05"></div>
        </div>
        <div class="sanpham">
          <img src="assets/images/a55.png"
            class="pic">

          <div class="productList" data-product-id="SP06"></div>
        </div>
        <div class="sanpham">
          <img src="assets/images/xom14.png"
          class="pic">
          <div class="productList" data-product-id="SP07"></div>
        </div>
      </div>
    </form>
    <div class="footer">
      <p>&copy; Quản lý Cửa hàng Điện thoại di động</p>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/product.js"></script>
</body>

</html>
